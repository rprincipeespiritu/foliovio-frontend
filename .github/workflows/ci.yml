name: Frontend CI
on:
  push:
    branches: [dev, prd]
  pull_request:
    branches: [dev, prd]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: docker build -t foliovio-frontend:ci .
      - run: docker run --rm -e API_UPSTREAM=http://localhost:3001 --entrypoint caddy foliovio-frontend:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile
